<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Range Picker - Khoảng giá</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.css" rel="stylesheet">
  <style>
    #slider {
      margin-top: 40px;
    }
  </style>
</head>

<body class="p-5">

  <div class="container">
    <h4>Chọn khoảng giá:</h4>
    <div id="slider"></div>
    <p class="mt-3">
      Giá từ: <strong id="minValue">1,000,000₫</strong> đến <strong id="maxValue">10,000,000₫</strong>
    </p>
  </div>

  <!-- Script -->
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.js"></script>
  <script>
    const slider = document.getElementById('slider');

    noUiSlider.create(slider, {
      start: [2000000, 8000000],
      connect: true,
      step: 500000,
      range: {
        min: 1000000,
        max: 10000000
      },
      format: {
        to: function (value) {
          return Math.round(value);
        },
        from: function (value) {
          return Number(value);
        }
      }
    });

    const minValue = document.getElementById('minValue');
    const maxValue = document.getElementById('maxValue');

    slider.noUiSlider.on('update', function (values) {
      minValue.textContent = Number(values[0]).toLocaleString('vi-VN') + '₫';
      maxValue.textContent = Number(values[1]).toLocaleString('vi-VN') + '₫';
    });
  </script>

</body>

</html>
